<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugar Lab by Haley | Thanksgiving Drop List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf4ee;--blush:#f2d9d0;--rose:#e8a99a;--dusty:#c97a6b;--sage:#7a8c6e;--sagel:#c8d4be;--text:#3a2e2a}
*{box-sizing:border-box;margin:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--blush),var(--cream) 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--cream);max-width:420px;width:100%;border-radius:24px;padding:36px 26px;text-align:center;box-shadow:0 10px 40px rgba(201,122,107,.18);border:1px solid var(--blush)}
img{width:120px;height:120px;border-radius:50%;object-fit:cover}
.script{font-family:'Dancing Script',cursive;color:var(--dusty);font-size:1.5rem;margin-top:10px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.2rem;line-height:1.1;margin:6px 0 12px}
p{font-weight:300;line-height:1.55;margin-bottom:20px}
.tag{display:inline-block;background:var(--sagel);color:#4b5a41;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px;margin-bottom:14px}
input[type=email]{width:100%;padding:15px;font:inherit;font-size:16px;border:1.5px solid var(--rose);border-radius:12px;background:#fff;color:var(--text);margin-bottom:12px}
input:focus{outline:2px solid var(--dusty);border-color:var(--dusty)}
button{width:100%;padding:15px;font:inherit;font-weight:500;letter-spacing:.06em;color:#fff;background:var(--dusty);border:0;border-radius:12px;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:.95rem;min-height:1.3em}
.ok{color:var(--sage);font-weight:500}.err{color:#b04a3a}
.fine{font-size:.75rem;color:#8a766f;margin:18px 0 0}
.hp{position:absolute;left:-9999px}
</style></head><body>

<h1>The Thanksgiving Drop</h1>
<p>A new batch is in development. Leave your email and you will be the first to know when the formulation is finalized and orders open.</p>
<form id="f" novalidate>
<input class="hp" type="text" name="website" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="email" id="em" placeholder="you@email.com" autocomplete="email" inputmode="email" required aria-label="Email address">

<script>
const U="https://atzqsaodpwxzdidqvikz.supabase.co/rest/v1/mailing_list",K="sb_publishable_kk4wzNZjXkIGChWqNNWr7A_dBN12cgm";
const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');
f.addEventListener('submit',async e=>{
 e.preventDefault();
 const em=document.getElementById('em').value.trim().toLowerCase();
 if(document.getElementById('hp').value){m.className='msg ok';m.textContent="You're on the list.";return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){m.className='msg err';m.textContent='Please enter a valid email.';return}
 b.disabled=true;m.className='msg';m.textContent='Saving...';
 try{
  const r=await fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:em,source:'market-qr'})});
  if(r.ok||r.status===409){m.className='msg ok';m.textContent="You're on the list. Watch your inbox!";f.reset();}
  else throw new Error(r.status);
 }catch(x){m.className='msg err';m.textContent='Something went wrong. Please try again, or email sugarlabboston@gmail.com.';b.disabled=false}
